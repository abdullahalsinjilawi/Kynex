services:
  # ---- الباك اند (Node.js Web Service) ----
  - type: web
    name: kynex-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # لازم تعبيها يدوياً من Render Dashboard بعد أول نشر (قيم حساسة، ما تنكتب هون):
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # اختياري - فحص الملفات المرفوعة بـ ClamAV. لو تركتها فاضية، الفحص بيضل معطّل
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        sync: false

  # ---- الفرونت اند (Static Site) ----
  - type: web
    name: kynex-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # عبّيها برابط الباك اند الحقيقي بعد أول نشر، مثلاً:
      # https://kynex-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # ضروري لأنو React Router بيتعامل مع التوجيه بالمتصفح (client-side routing)
      - type: rewrite
        source: /*
        destination: /index.html
